name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches plugin.json
        run: |
          want="v$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "$want" || { echo "Tag $GITHUB_REF_NAME but plugin.json says $want"; exit 1; }
      - name: Build flow-chart.zip for the Claude apps
        run: cd skills && zip -r -X ../flow-chart.zip flow-chart -x '*/__pycache__/*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" flow-chart.zip --title "flow-chart $GITHUB_REF_NAME" --generate-notes
