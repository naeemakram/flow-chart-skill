name: Release

# Publishes a GitHub Release with flow-chart.zip for the version in plugin.json.
# - Push to main: if no release exists yet for that version, create it (and its tag).
#   To release a new version, bump "version" in plugin/.claude-plugin/plugin.json.
# - Tag push or a release made in the browser: build the zip and attach it.

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/release-notes/**"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  release:
    types: [published]

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: v
        run: |
          want="v$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "release" ]; then
            test "$GITHUB_REF_NAME" = "$want" || { echo "Tag $GITHUB_REF_NAME but plugin.json says $want"; exit 1; }
          fi
          echo "tag=$want" >> "$GITHUB_OUTPUT"
      - name: Build flow-chart.zip for the Claude apps
        run: cd plugin/skills && zip -r -X ../../flow-chart.zip flow-chart -x '*/__pycache__/*'
      - name: Publish the release, or add the zip to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "$TAG is already released; bump the version in plugin.json to release again."
              exit 0
            fi
            gh release upload "$TAG" flow-chart.zip --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" flow-chart.zip --target "$GITHUB_SHA" --title "flow-chart $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" flow-chart.zip --target "$GITHUB_SHA" --title "flow-chart $TAG" --generate-notes
          fi
